name: myapp
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  app_bootstrap:
    path: packages/app_bootstrap
  app_core:
    path: packages/app_core
  app_getx_integration:
    path: packages/app_getx_integration
  app_orchestrator:
    path: packages/app_orchestrator
  app_shell_utils:
    path: packages/app_shell_utils
  design_tokens:
    path: packages/design_tokens
  equatable: ^2.1.0
  flutter:
    sdk: flutter
  get_it: ^9.2.1
  injectable: ^2.7.1+4
  shared_assets:
    path: packages/shared_assets
  shared_widgets:
    path: packages/shared_widgets
  team_rules:
    path: packages/team_rules

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  json_serializable: ^6.11.2
  injectable_generator: ^2.9.1

flutter:
  uses-material-design: true
workspace:
  - packages/shared_widgets
  - packages/design_tokens
  - packages/shared_assets
  - packages/app_shell_utils
  - packages/team_rules
  - packages/app_getx_integration
  - packages/app_orchestrator
  - packages/app_core
  - packages/app_bootstrap
finvoras_gen:
  output: lib/generated/
  line_length: 80
  assets:
    enabled: true
    outputs:
      class_name: AppAssets
  locales:
    enabled: true
    folder: assets/locales
    outputs:
      translation_name: AppTranslation
      keys_name: AppLocalesKeys
melos:
  scripts:
    get:
      run: melos exec -- "rm -f pubspec.lock && flutter pub get"
      description: Delete lock file and get all dependencies
    analyze:
      run: melos exec -- "flutter analyze"
      description: Run `flutter analyze` in all packages
    build_assets:
      run: melos exec --concurrency=1 --dir-exists=assets -- "flutter pub get && if grep -q \"build_runner\" pubspec.yaml; then flutter pub run build_runner build --delete-conflicting-outputs; else echo 'Skipping build_runner'; fi && finvoras_gen -c pubspec.yaml"
      description: Generate assets code
